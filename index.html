<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B2D">
<meta name="description" content="Example demo: Rigbench, a made-up computer store. Customers build a PC with plain-English compatibility checks, and the store sees which ready-to-ship models it can assemble from parts stock and what to reorder.">
<title>Rigbench · Build-a-PC Example Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: top bar (brand, tabs) over one wide column; Build = slot pickers + sticky summary, Models = cards, Stock = card grid, Reorder = list. */
:root{
  color-scheme:light;
  --navy:#0F1B2D; --navy-2:#1A2B45; --mint:#19C39B; --mint-deep:#0E9C7B; --mint-soft:rgba(25,195,155,.14);
  --bg:#F4F6F9; --panel:#FFFFFF; --panel-2:#EEF2F6; --line:#E2E7EE; --line-2:#CFD7E2;
  --ink:#142033; --muted:#5B6779; --faint:#8C97A8;
  --ok:#157A4A; --ok-soft:#E1F4EA; --low:#9A5B00; --low-soft:#FFF1C7; --out:#C62F3B; --out-soft:#FCE3E5;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
body{background:var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--mint-deep);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--mint);box-shadow:0 2px 12px rgba(0,0,0,.14)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--navy)}
.brand b{font:700 19px var(--display);letter-spacing:-.01em;color:#fff}
.brand span{display:block;font:500 11.5px var(--mono);color:rgba(255,255,255,.7)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.85);font:600 14px var(--body);padding:8px 14px;border-radius:9px;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.1)}
.tabs button[aria-selected="true"]{background:var(--mint);color:var(--navy)}
.tabs .n{font:600 11px var(--mono);background:var(--out);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;font:12px var(--mono);color:rgba(255,255,255,.7)}
.top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.top .btn:hover{border-color:var(--mint)}
.example{background:var(--mint-soft);border-bottom:1px solid var(--line);color:var(--ink);text-align:center;font:500 13px var(--body);padding:7px 16px}
.example b{font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;padding:7px 12px;font:600 13px var(--body);color:var(--ink)}
.btn:hover{border-color:var(--mint-deep)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.big{width:100%;padding:12px;font-size:15px;border-radius:11px}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
h1{font:700 26px var(--display);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font:600 26px var(--mono);line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.warn b{color:var(--low)} .tile.bad b{color:var(--out)} .tile.good b{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tools .lbl{font:600 12px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{border:1px solid var(--line-2);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 12px;font:600 12.5px var(--body)}
.chip:hover{color:var(--ink);border-color:var(--mint-deep)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{margin-left:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;min-width:220px}
.search:focus{outline:none;border-color:var(--mint-deep)}
.pill{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.low{background:var(--low-soft);color:var(--low)} .pill.out{background:var(--out-soft);color:var(--out)}

/* build */
.build{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:960px){.build{grid-template-columns:1fr}}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.slot-h h2{font:600 16px var(--display);margin:0}
.slot-h span{font:12px var(--mono);color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;position:relative}
.opt:hover{border-color:var(--mint-deep)}
.opt b{font:600 14px var(--display)}
.opt small{font-size:12px;color:var(--muted);line-height:1.35}
.opt .ofoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px}
.opt .price{font:600 13px var(--mono)}
.opt .diff{font:12px var(--mono);color:var(--muted)}
.opt.sel{border:2px solid var(--mint-deep);background:var(--mint-soft);padding:9px 11px}
.opt.sel::after{content:"✓";position:absolute;top:8px;right:10px;font:700 13px var(--mono);color:var(--mint-deep)}
.opt.blocked{background:var(--panel-2);border-style:dashed}
.opt.blocked b,.opt.blocked .price{color:var(--faint)}
.why{font:600 11.5px var(--body);color:var(--out)}
.sum{position:sticky;top:96px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(15,27,45,.07);display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.sum{position:static}}
.sum h2{font:700 18px var(--display);margin:0}
.sum h3{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 6px}
.lines{list-style:none;margin:0;padding:0;font-size:13px}
.lines li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.lines .k{color:var(--faint);font:11.5px var(--mono);padding-top:2px}
.lines .v{font:12.5px var(--mono);text-align:right}
.lines li.oos span:nth-child(2){color:var(--out)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px}
.total b{font:600 28px var(--mono)}
.power .bar{height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin:6px 0 4px}
.power .bar i{display:block;height:100%;border-radius:5px;background:var(--pw)}
.power small{font:12px var(--mono);color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;line-height:1.4}
.checks li::before{font:700 13px var(--mono)}
.checks li.ok::before{content:"✓";color:var(--ok)}
.checks li.warn::before{content:"!";color:var(--low)}
.checks li.bad::before{content:"✕";color:var(--out)}
.checks li.bad{color:var(--out)}
.ship{border-radius:12px;padding:10px 12px;font-size:13px}
.ship.ok{background:var(--ok-soft);color:var(--ok)} .ship.low{background:var(--low-soft);color:var(--low)} .ship.out{background:var(--out-soft);color:var(--out)}

/* stock */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.part{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,27,45,.05);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.part::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st)}
.part.ok{--st:var(--ok)} .part.low{--st:var(--low)} .part.out{--st:var(--out)}
.part-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.part-h b{font:600 16px var(--display);line-height:1.25}
.part-h .cat{display:block;font:11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.qty{display:flex;align-items:baseline;gap:8px}
.qty b{font:600 34px/1 var(--mono)}
.qty span{color:var(--muted);font-size:13px}
.par{display:flex;flex-direction:column;gap:4px}
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--st);transition:width .3s}
.par small{font:11.5px var(--mono);color:var(--muted)}
.ctrl{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:6px}
.ctrl button{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;font:600 18px var(--mono);height:38px}
.ctrl button:hover{border-color:var(--mint-deep);color:var(--mint-deep)}
.ctrl input{background:#fff;border:1px solid var(--line-2);border-radius:9px;text-align:center;font:600 15px var(--mono);height:38px;width:100%}
.ctrl input:focus{outline:none;border-color:var(--mint-deep)}
.part-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.used{display:flex;flex-wrap:wrap;gap:4px}
.used span{font:11px var(--mono);background:var(--panel-2);border-radius:5px;padding:1px 6px;color:var(--muted)}

/* models */
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.model{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--mint);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(15,27,45,.05);display:flex;flex-direction:column;gap:14px}
.model-h{display:flex;gap:14px;align-items:center}
.ico{width:52px;height:52px;border-radius:14px;background:var(--navy);color:var(--mint);display:grid;place-items:center;font:700 15px var(--mono);flex:none}
.model-h h2{font:700 19px var(--display);margin:0}
.model-h p{margin:0;font-size:12.5px;color:var(--muted)}
.model-h .mp{margin-left:auto;font:600 17px var(--mono)}
.make{display:flex;align-items:center;gap:14px;background:var(--panel-2);border-radius:12px;padding:12px 14px}
.make b{font:600 36px/1 var(--mono)}
.make.ok b{color:var(--ok)} .make.low b{color:var(--low)} .make.out b{color:var(--out)}
.make div{font-size:13px;color:var(--muted)}
.make div strong{color:var(--ink);font-weight:600}
.recipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.recipe li{display:grid;grid-template-columns:18px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.recipe li:first-child{border-top:0}
.recipe .k{font:11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.recipe li.low .dot{background:var(--low)} .recipe li.out .dot{background:var(--out)} .recipe li.lim .dot{box-shadow:0 0 0 3px rgba(198,47,59,.25)}
.recipe .r{font:12px var(--mono);color:var(--muted);text-align:right}
.recipe li.lim .r{color:var(--out);font-weight:600}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.mfoot .btn:last-child{margin-left:auto}

/* reorder */
.list{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,27,45,.05);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) 110px 110px 150px 170px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:var(--panel-2)}
.row b{font-weight:600}
.row .m{font:13px var(--mono)}
.row .sug{font:600 14px var(--mono);color:var(--mint-deep)}
@media (max-width:820px){.row{grid-template-columns:1fr 1fr}.row.head{display:none}}
.empty{color:var(--muted);text-align:center;padding:30px}
.note{margin-top:28px;font-size:12px;color:var(--faint);text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;background:var(--navy);border:2px solid var(--mint);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:50;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:600px){.top-r{margin-left:0}.search{margin-left:0;min-width:0;flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></div><div><b>Rigbench</b><span>Made-up PC store · demo</span></div></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="build">Build your PC</button>
    <button role="tab" data-tab="models">Ready-to-ship</button>
    <button role="tab" data-tab="stock">Parts stock</button>
    <button role="tab" data-tab="reorder">Reorder<span class="n" id="reN" hidden></span></button>
  </nav>
  <div class="top-r"><span id="saved">Saved in this browser</span><button class="btn sm" data-reset>Reset demo</button></div>
</div></header>
<div class="example"><b>Example demo.</b> Rigbench is a made-up computer store. Every product, part name and price here is invented sample data.</div>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
/* ---------- data ---------- */
const SLOTS=[['cpu','Processor'],['board','Motherboard'],['ram','Memory'],['gpu','Graphics'],['storage','Storage'],['cooler','Cooler'],['psu','Power supply'],['case','Case']];
const SLOT_NAME=Object.fromEntries(SLOTS);
const PACK={cpu:5,board:5,ram:10,gpu:4,storage:10,cooler:10,psu:6,case:4};
const ASSEMBLY=99, BASE_W=75, HEADROOM=1.3;
const SEED={
  parts:[
    {id:'c5',cat:'cpu',name:'Corefield C5',cores:6,socket:'S-800',tdp:65,igpu:true,price:189,qty:22,par:20},
    {id:'c7',cat:'cpu',name:'Corefield C7',cores:8,socket:'S-800',tdp:105,igpu:false,price:329,qty:15,par:20},
    {id:'x7',cat:'cpu',name:'Corefield X7',cores:12,socket:'S-900',tdp:120,igpu:false,price:449,qty:9,par:10},
    {id:'x9',cat:'cpu',name:'Corefield X9',cores:16,socket:'S-900',tdp:170,igpu:false,price:579,qty:6,par:8},
    {id:'b8m',cat:'board',name:'Ridge B8-M',socket:'S-800',ff:'mATX',ram:'DDR4',price:119,qty:18,par:15},
    {id:'b8x',cat:'board',name:'Ridge B8-X',socket:'S-800',ff:'ATX',ram:'DDR5',price:189,qty:12,par:15},
    {id:'z9a',cat:'board',name:'Ridge Z9-A',socket:'S-900',ff:'ATX',ram:'DDR5',price:299,qty:7,par:8},
    {id:'z9i',cat:'board',name:'Ridge Z9-Mini',socket:'S-900',ff:'ITX',ram:'DDR5',price:259,qty:5,par:6},
    {id:'r16',cat:'ram',name:'16 GB DDR4 kit',gb:16,type:'DDR4',price:49,qty:40,par:30},
    {id:'r32',cat:'ram',name:'32 GB DDR5 kit',gb:32,type:'DDR5',price:109,qty:14,par:30},
    {id:'r64',cat:'ram',name:'64 GB DDR5 kit',gb:64,type:'DDR5',price:219,qty:8,par:10},
    {id:'l4',cat:'gpu',name:'Lumen L4',vram:8,w:160,len:242,price:299,qty:11,par:12},

    {id:'l8',cat:'gpu',name:'Lumen L8',vram:16,w:320,len:336,price:999,qty:4,par:6},
    {id:'s1',cat:'storage',name:'1 TB NVMe SSD',tb:1,price:69,qty:35,par:25},
    {id:'s2',cat:'storage',name:'2 TB NVMe SSD',tb:2,price:129,qty:21,par:25},
    {id:'s4',cat:'storage',name:'4 TB NVMe SSD',tb:4,price:259,qty:6,par:8},
    {id:'cb',cat:'cooler',name:'Basic air cooler',h:65,tdp:95,price:29,qty:30,par:20},
    {id:'cs',cat:'cooler',name:'Slim Pro low-profile',h:68,tdp:130,price:49,qty:0,par:10},
    {id:'ct',cat:'cooler',name:'Tower air cooler',h:155,tdp:200,price:59,qty:19,par:20},
    {id:'p5',cat:'psu',name:'550 W Bronze',w:550,price:69,qty:20,par:15},
    {id:'p7',cat:'psu',name:'750 W Gold',w:750,price:109,qty:6,par:20},
    {id:'p10',cat:'psu',name:'1000 W Gold',w:1000,price:179,qty:7,par:8},
    {id:'ks',cat:'case',name:'Studio mATX case',fits:['mATX','ITX'],gpuMax:320,coolerMax:160,price:89,qty:13,par:12},
    {id:'km',cat:'case',name:'Mid tower case',fits:['ATX','mATX','ITX'],gpuMax:340,coolerMax:165,price:109,qty:16,par:15},
    {id:'kc',cat:'case',name:'Compact ITX case',fits:['ITX'],gpuMax:300,coolerMax:70,price:99,qty:4,par:6},
  ],
  models:[
    {id:'office',name:'Office One',ico:'O1',desc:'Email, docs, video calls',build:{cpu:'c5',board:'b8m',ram:'r16',gpu:'',storage:'s1',cooler:'cb',psu:'p5',case:'ks'}},
    {id:'creator',name:'Creator C7',ico:'C7',desc:'Photo editing and light video',build:{cpu:'c7',board:'b8x',ram:'r32',gpu:'l4',storage:'s2',cooler:'ct',psu:'p7',case:'km'}},
    {id:'gamer',name:'Gamer L6',ico:'L6',desc:'1440p gaming',build:{cpu:'c7',board:'b8x',ram:'r32',gpu:'l6',storage:'s2',cooler:'ct',psu:'p7',case:'km'}},
    {id:'mini',name:'Mini X7',ico:'M7',desc:'Small desk, real power',build:{cpu:'x7',board:'z9i',ram:'r32',gpu:'l4',storage:'s1',cooler:'cs',psu:'p5',case:'kc'}},
    {id:'studio',name:'Studio X9',ico:'X9',desc:'4K video, 3D, big datasets',build:{cpu:'x9',board:'z9a',ram:'r64',gpu:'l8',storage:'s4',cooler:'ct',psu:'p10',case:'km'}},
  ],
  orders:1041,
};
SEED.build={...SEED.models[1].build};
const KEY='rigbench-demo.v1';
const fresh=()=>JSON.parse(JSON.stringify(SEED));
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.parts||!S.build)S=fresh();
S.ui=S.ui||{tab:'build',cat:'All',q:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};const sv=document.getElementById('saved');if(sv)sv.textContent='Saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.parts.find(p=>p.id===id);
const money=n=>'$'+n.toLocaleString();
const status=p=>p.qty<=0?'out':p.qty<p.par*0.5?'low':'ok';
const STATUS_TXT={ok:'In stock',low:'Low',out:'Out'};
function spec(p){switch(p.cat){
  case 'cpu':return `${p.cores} cores · socket ${p.socket} · ${p.tdp} W${p.igpu?' · built-in graphics':''}`;
  case 'board':return `socket ${p.socket} · ${p.ff} · ${p.ram}`;
  case 'ram':return `${p.gb} GB · ${p.type}`;
  case 'gpu':return `${p.vram} GB · ${p.w} W · ${p.len} mm long`;
  case 'storage':return `${p.tb} TB · fast NVMe drive`;
  case 'cooler':return `${p.h} mm tall · cools up to ${p.tdp} W`;
  case 'psu':return `${p.w} W power supply`;
  case 'case':return `fits ${p.fits.join(' / ')} · GPU ≤ ${p.gpuMax} mm · cooler ≤ ${p.coolerMax} mm`;
}}
const partsOf=b=>SLOTS.map(([s])=>P(b[s])).filter(Boolean);
const priceOf=b=>partsOf(b).reduce((t,p)=>t+p.price,0)+ASSEMBLY;
const drawOf=b=>(P(b.cpu)?.tdp||0)+(P(b.gpu)?.w||0)+BASE_W;
const usedIn=id=>S.models.filter(m=>Object.values(m.build).includes(id)).map(m=>m.name);

/* Every rule names the slots it involves, so a picker can explain why an option won't work. */
function checks(b){
  const cpu=P(b.cpu),board=P(b.board),ram=P(b.ram),gpu=P(b.gpu),cooler=P(b.cooler),psu=P(b.psu),cs=P(b.case),out=[];
  const add=(ok,slots,good,bad,short,lvl)=>out.push(ok?{lvl:'ok',slots,msg:good}:{lvl:lvl||'bad',slots,msg:bad,short});
  if(cpu&&board)add(cpu.socket===board.socket,['cpu','board'],`Processor fits the motherboard (socket ${cpu.socket}).`,`${cpu.name} needs socket ${cpu.socket}, but the ${board.name} is socket ${board.socket}.`,`Wrong socket`);
  if(ram&&board)add(ram.type===board.ram,['ram','board'],`Memory matches the motherboard (${board.ram}).`,`The ${board.name} takes ${board.ram} memory, not ${ram.type}.`,`Wrong memory type`);
  if(board&&cs)add(cs.fits.includes(board.ff),['board','case'],`${board.ff} motherboard fits the case.`,`A ${board.ff} motherboard is too big for the ${cs.name}.`,`Doesn't fit the case`);
  if(gpu&&cs)add(gpu.len<=cs.gpuMax,['gpu','case'],`Graphics card fits (${gpu.len} of ${cs.gpuMax} mm).`,`The ${gpu.name} is ${gpu.len} mm long; the ${cs.name} only fits ${cs.gpuMax} mm.`,`Too long for the case`);
  if(cooler&&cs)add(cooler.h<=cs.coolerMax,['cooler','case'],`Cooler fits the case (${cooler.h} of ${cs.coolerMax} mm).`,`The ${cooler.name} is ${cooler.h} mm tall; the ${cs.name} only fits ${cs.coolerMax} mm.`,`Too tall for the case`);
  if(cooler&&cpu)add(cooler.tdp>=cpu.tdp,['cooler','cpu'],`Cooler handles the processor's ${cpu.tdp} W.`,`The ${cooler.name} cools up to ${cooler.tdp} W, but the ${cpu.name} puts out ${cpu.tdp} W.`,`Can't cool it`);
  if(cpu&&!gpu)add(cpu.igpu,['cpu','gpu'],`No graphics card needed: the ${cpu.name} has built-in graphics.`,`The ${cpu.name} has no built-in graphics, so the screen would stay black. Add a graphics card.`,`No display output`);
  if(psu){const d=drawOf(b),rec=Math.ceil(d*HEADROOM/50)*50;
    if(psu.w<d)add(false,['psu','cpu','gpu'],'',`This build can draw about ${d} W, more than the ${psu.w} W power supply can give.`,`Not enough power`);
    else if(psu.w<d*HEADROOM)add(false,['psu'],'',`Power is tight: about ${d} W on a ${psu.w} W supply. ${rec} W or more is safer.`,`Tight on power`,'warn');
    else add(true,['psu'],`Power supply has room to spare (${d} W of ${psu.w} W).`);}
  return out;
}
function optionIssue(slot,id){const c=checks({...S.build,[slot]:id}).find(c=>c.lvl==='bad'&&c.slots.includes(slot));return c?c.short:null}
function canAssemble(m){let best=Infinity,lim=null;Object.values(m.build).filter(Boolean).forEach(id=>{const q=Math.max(0,P(id).qty);if(q<best){best=q;lim=id}});return {n:best===Infinity?0:best,lim}}
const makeStatus=n=>n<=0?'out':n<3?'low':'ok';
const reorderList=()=>S.parts.filter(p=>p.qty<p.par*0.75).map(p=>{const pack=PACK[p.cat],need=Math.max(0,Math.round(p.par*1.25)-p.qty),packs=Math.max(1,Math.ceil(need/pack));return {...p,pack,packs,units:packs*pack}}).sort((a,b)=>(a.qty/a.par)-(b.qty/b.par));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- views ---------- */
function renderBuild(){
  const b=S.build, ch=checks(b), bad=ch.filter(c=>c.lvl==='bad'), cur=priceOf(b), d=drawOf(b), psu=P(b.psu);
  const oos=partsOf(b).filter(p=>p.qty<=0), lowP=partsOf(b).filter(p=>p.qty>0&&p.qty<3);
  const pct=psu?Math.min(100,Math.round(d/psu.w*100)):0, pw=!psu||d>psu.w?'var(--out)':d*HEADROOM>psu.w?'var(--low)':'var(--ok)';
  const ship=bad.length?{c:'out',t:'Fix the issues above before ordering.'}:oos.length?{c:'out',t:`${oos.map(p=>p.name).join(', ')} ${oos.length>1?'are':'is'} out of stock. Swap ${oos.length>1?'them':'it'} or check back after the next delivery.`}:lowP.length?{c:'low',t:`Ships in 2 business days. Only ${lowP.map(p=>`${p.qty} ${p.name}`).join(', ')} left.`}:{c:'ok',t:'In stock. Assembled, tested and shipped in 2 business days.'};
  const slots=SLOTS.map(([slot,label])=>{
    const opts=S.parts.filter(p=>p.cat===slot), sel=P(b[slot]);
    if(slot==='gpu')opts.unshift({id:'',name:'No graphics card',price:0,none:true});
    return `<section class="slot"><div class="slot-h"><h2>${label}</h2><span>${esc(sel?sel.name:'None')}</span></div><div class="opts">${opts.map(p=>{
      const isSel=(b[slot]||'')===p.id, issue=isSel?null:optionIssue(slot,p.id), st=p.none?null:status(p);
      const diff=p.price-(sel?sel.price:0);
      return `<button class="opt${isSel?' sel':''}${issue?' blocked':''}" data-pick="${slot}|${p.id}" aria-pressed="${isSel}"><b>${esc(p.name)}</b><small>${p.none?'Uses the processor\'s built-in graphics':esc(spec(p))}</small>${issue?`<span class="why">✕ ${esc(issue)}</span>`:''}
        <span class="ofoot"><span class="price">${p.none?'$0':money(p.price)}</span>${isSel?'':`<span class="diff">${diff>0?'+':diff<0?'−':'±'}${money(Math.abs(diff))}</span>`}${st&&st!=='ok'?`<span class="pill ${st}">${st==='out'?'Out':p.qty+' left'}</span>`:''}</span></button>`}).join('')}</div></section>`}).join('');
  return `<div class="phead"><div><h1>Build your PC</h1><p class="sub">Pick each part. Rigbench checks that everything fits, has enough power and is in stock, and tells you why in plain English.</p></div></div>
  <div class="tools"><span class="lbl">Start from</span>${S.models.map(m=>`<button class="chip" data-load="${m.id}">${esc(m.name)}</button>`).join('')}</div>
  <div class="build"><div>${slots}</div>
  <aside class="sum" aria-label="Build summary"><h2>Your build</h2>
    <ul class="lines">${SLOTS.map(([s,l])=>{const p=P(b[s]);return `<li class="${p&&p.qty<=0?'oos':''}"><span class="k">${l}</span><span>${esc(p?p.name:'None')}</span><span class="v">${p?money(p.price):'—'}</span></li>`}).join('')}<li><span class="k">Service</span><span>Assembly &amp; testing</span><span class="v">${money(ASSEMBLY)}</span></li></ul>
    <div class="total"><span>Total</span><b>${money(cur)}</b></div>
    <div class="power" style="--pw:${pw}"><h3>Power</h3><div class="bar"><i style="width:${pct}%"></i></div><small>About ${d} W of ${psu?psu.w:0} W</small></div>
    <div><h3>Compatibility</h3><ul class="checks">${ch.map(c=>`<li class="${c.lvl}">${esc(c.msg)}</li>`).join('')}</ul></div>
    <div class="ship ${ship.c}">${esc(ship.t)}</div>
    <button class="btn primary big" data-order ${bad.length||oos.length?'disabled':''}>Place order · ${money(cur)}</button>
  </aside></div>`;
}
function renderModels(){
  return `<div class="phead"><div><h1>Ready-to-ship models</h1><p class="sub">How many of each model the store can assemble from parts on the shelf right now, and which part is holding it back.</p></div></div>
  <div class="models">${S.models.map(m=>{const c=canAssemble(m),ms=makeStatus(c.n);
    return `<article class="model"><div class="model-h"><div class="ico" aria-hidden="true">${esc(m.ico)}</div><div><h2>${esc(m.name)}</h2><p>${esc(m.desc)}</p></div><span class="mp">${money(priceOf(m.build))}</span></div>
      <div class="make ${ms}"><b>${c.n}</b><div>${c.n<=0?`<strong>Can't assemble any.</strong><br>Out of ${esc(P(c.lim).name)}.`:`can be assembled now<br>Limited by <strong>${esc(P(c.lim).name)}</strong>`}</div></div>
      <ul class="recipe">${SLOTS.filter(([s])=>m.build[s]).map(([s,l])=>{const p=P(m.build[s]),st=status(p);return `<li class="${st}${p.id===c.lim?' lim':''}"><span class="dot"></span><span class="k">${l}</span><span>${esc(p.name)}</span><span class="r">${p.qty} on hand</span></li>`}).join('')}</ul>
      <div class="mfoot"><button class="btn sm" data-load="${m.id}">Customize in builder</button><button class="btn sm primary" data-assemble="${m.id}" ${c.n<1?'disabled':''}>Assemble 1</button></div></article>`}).join('')}</div>`;
}
function renderStock(){
  const all=S.parts, low=all.filter(p=>status(p)==='low').length, out=all.filter(p=>status(p)==='out').length;
  const atRisk=S.models.filter(m=>canAssemble(m).n<3).length;
  const q=(S.ui.q||'').toLowerCase(), cat=S.ui.cat||'All';
  const list=all.filter(p=>(cat==='All'||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q)));
  return `<div class="phead"><div><h1>Parts stock</h1><p class="sub">Count parts as they come and go. The builder, models and reorder list update instantly.</p></div></div>
  <div class="tiles"><div class="tile"><b>${all.length}</b><span>parts tracked</span></div><div class="tile ${low?'warn':'good'}"><b>${low}</b><span>running low</span></div><div class="tile ${out?'bad':'good'}"><b>${out}</b><span>out of stock</span></div><div class="tile ${atRisk?'warn':'good'}"><b>${atRisk}/${S.models.length}</b><span>models at risk</span></div></div>
  <div class="tools">${[['All','All'],...SLOTS].map(([c,l])=>`<button class="chip${c===cat?' on':''}" data-cat="${c}">${esc(l)}</button>`).join('')}<input class="search" id="q" type="search" placeholder="Search parts…" value="${esc(S.ui.q||'')}" aria-label="Search parts"></div>
  <div class="grid">${list.map(p=>{const st=status(p),pct=Math.min(100,Math.round(p.qty/p.par*100)),u=usedIn(p.id),pk=PACK[p.cat];
    return `<article class="part ${st}"><div class="part-h"><div><b>${esc(p.name)}</b><span class="cat">${esc(SLOT_NAME[p.cat])} · ${money(p.price)}</span></div><span class="pill ${st}">${STATUS_TXT[st]}</span></div>
      <div class="qty"><b>${p.qty}</b><span>on the shelf</span></div>
      <div class="par"><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% of target (${p.par})</small></div>
      <div class="ctrl"><button data-step="${p.id}|-1" aria-label="Remove one ${esc(p.name)}">−</button><input type="number" min="0" inputmode="numeric" value="${p.qty}" data-set="${p.id}" aria-label="${esc(p.name)} count"><button data-step="${p.id}|1" aria-label="Add one ${esc(p.name)}">+</button></div>
      <div class="part-f"><div class="used">${u.length?u.map(n=>`<span>${esc(n)}</span>`).join(''):'<span>Custom builds only</span>'}</div><button class="btn sm" data-recv="${p.id}" title="Adds one pack of ${pk}">+ Delivery (${pk})</button></div></article>`}).join('')||'<p class="empty">No parts match.</p>'}</div>`;
}
function renderReorder(){
  const L=reorderList();
  return `<div class="phead"><div><h1>Reorder</h1><p class="sub">Every part under 75% of its target, with an order that brings it back above target, rounded up to whole supplier packs.</p></div>${L.length?`<button class="btn primary" data-recvall style="margin-left:auto">Mark all received</button>`:''}</div>
  ${L.length?`<div class="list"><div class="row head"><span>Part</span><span>On hand</span><span>Target</span><span>Suggested order</span><span></span></div>
    ${L.map(p=>{const st=status(p);return `<div class="row"><span><b>${esc(p.name)}</b> <span class="pill ${st}">${STATUS_TXT[st]}</span></span><span class="m">${p.qty}</span><span class="m">${p.par}</span><span class="sug">${p.packs} pack${p.packs>1?'s':''} · ${p.units}</span><span><button class="btn sm" data-recvn="${p.id}|${p.units}">Mark received</button></span></div>`}).join('')}</div>`
    :'<p class="empty">Everything is above its reorder point. Nothing to order.</p>'}`;
}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.ui.tab));
  const n=reorderList().length, rn=$('#reN'); rn.hidden=!n; rn.textContent=n;
  const app=$('#app'), focusQ=document.activeElement&&document.activeElement.id==='q';
  app.innerHTML=({build:renderBuild,models:renderModels,stock:renderStock,reorder:renderReorder}[S.ui.tab]||renderBuild)()+`<p class="note">Example demo. Rigbench and every product in it are made up. Changes are saved only in this browser.</p>`;
  if(focusQ){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}

/* ---------- actions ---------- */
function setQty(id,v){P(id).qty=Math.max(0,Math.round(+v||0));save();render()}
function take(b){partsOf(b).forEach(p=>{p.qty=Math.max(0,p.qty-1)})}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){S.ui.tab=t.dataset.tab;save();render();scrollTo(0,0);return}
  const pk=e.target.closest('[data-pick]'); if(pk){const [s,id]=pk.dataset.pick.split('|');S.build[s]=id;save();const y=scrollY;render();scrollTo(0,y);return}
  const ld=e.target.closest('[data-load]'); if(ld){const m=S.models.find(x=>x.id===ld.dataset.load);S.build={...m.build};S.ui.tab='build';save();render();scrollTo(0,0);toast(`Loaded ${m.name}. Change any part you like.`);return}
  if(e.target.closest('[data-order]')){take(S.build);S.orders++;save();render();toast(`Order RB-${S.orders} placed. Parts reserved from stock.`);return}
  const as=e.target.closest('[data-assemble]'); if(as){const m=S.models.find(x=>x.id===as.dataset.assemble);if(canAssemble(m).n<1)return;take(m.build);save();render();toast(`Assembled 1 ${m.name}. Parts deducted.`);return}
  const c=e.target.closest('[data-cat]'); if(c){S.ui.cat=c.dataset.cat;save();render();return}
  const st=e.target.closest('[data-step]'); if(st){const [id,d]=st.dataset.step.split('|');setQty(id,P(id).qty+ +d);return}
  const r=e.target.closest('[data-recv]'); if(r){const p=P(r.dataset.recv),n=PACK[p.cat];p.qty+=n;save();render();toast(`Received ${n} × ${p.name}`);return}
  const rn=e.target.closest('[data-recvn]'); if(rn){const [id,n]=rn.dataset.recvn.split('|');const p=P(id);p.qty+= +n;save();render();toast(`Received ${n} × ${p.name}`);return}
  if(e.target.closest('[data-recvall]')){const L=reorderList();L.forEach(x=>{P(x.id).qty+=x.units});save();render();toast(`Received ${L.length} deliveries`);return}
  if(e.target.closest('[data-reset]')){const b=e.target.closest('[data-reset]');if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Click again to reset';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset demo'}},3000);return}
    S=fresh();S.ui={tab:'build',cat:'All',q:''};save();render();toast('Demo reset');return}
});
document.addEventListener('change',e=>{if(e.target.dataset.set)setQty(e.target.dataset.set,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.ui.q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-set]'))e.target.blur()});
render();
})();
</script>
</body>
</html>
